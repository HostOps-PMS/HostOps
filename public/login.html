<!--
  ═══════════════════════════════════════════════════════════════
  HostPilot Login/Register
  ═══════════════════════════════════════════════════════════════
  Paano gamitin sa GHL:
  1. Sa GHL Funnel Builder, gumawa ng new page (e.g., /login)
  2. Magdagdag ng "Custom HTML" element
  3. I-paste yung buong content nito (kasama ang <script> sa baba)
  4. I-update yung API_BASE sa Render URL mo
  ═══════════════════════════════════════════════════════════════
-->
<style>
  .hp-auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;background:#eaf8f1;padding:20px;}
  .hp-auth-card{background:#fff;border-radius:24px;padding:40px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(4,14,9,.08);}
  .hp-auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:32px;}
  .hp-auth-logo-mark{width:38px;height:38px;background:#26a676;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-family:'Sora',sans-serif;font-size:18px;}
  .hp-auth-brand{font-family:'Sora',sans-serif;font-weight:800;font-size:1.2rem;color:#0c1c14;}
  .hp-auth-tabs{display:flex;background:#f0f5f2;border-radius:100px;padding:4px;margin-bottom:24px;}
  .hp-auth-tab{flex:1;padding:10px;border:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:.88rem;font-weight:700;color:#6a8b7c;cursor:pointer;border-radius:100px;}
  .hp-auth-tab.active{background:#fff;color:#0c1c14;box-shadow:0 2px 8px rgba(0,0,0,.05);}
  .hp-auth-h1{font-family:'Sora',sans-serif;font-weight:800;font-size:1.5rem;color:#0c1c14;margin:0 0 6px;}
  .hp-auth-sub{color:#6a8b7c;font-size:.88rem;margin:0 0 24px;}
  .hp-auth-field{display:block;margin-bottom:14px;}
  .hp-auth-label{display:block;font-size:.78rem;font-weight:700;color:#2a4e3c;margin-bottom:6px;}
  .hp-auth-input{width:100%;padding:13px 16px;border:1.5px solid #e3ede8;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:.95rem;color:#0c1c14;background:#f8fbf9;outline:none;transition:all .2s;box-sizing:border-box;}
  .hp-auth-input:focus{border-color:#26a676;background:#fff;box-shadow:0 0 0 3px rgba(38,166,118,.1);}
  .hp-auth-btn{width:100%;padding:14px;background:#26a676;color:#fff;border:none;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;margin-top:8px;transition:all .2s;}
  .hp-auth-btn:hover:not(:disabled){background:#1e8760;}
  .hp-auth-btn:disabled{opacity:.5;cursor:not-allowed;}
  .hp-auth-link{display:block;text-align:center;margin-top:16px;font-size:.85rem;color:#26a676;text-decoration:none;font-weight:600;cursor:pointer;}
  .hp-auth-link:hover{text-decoration:underline;}
  .hp-auth-msg{padding:12px 14px;border-radius:10px;font-size:.85rem;margin-bottom:16px;display:none;}
  .hp-auth-msg.error{background:#fff0ee;color:#c13515;border:1px solid #ffd5ce;}
  .hp-auth-msg.success{background:#d4f0e4;color:#1e8760;border:1px solid #b7e4cf;}
  .hp-auth-msg.show{display:block;}
  .hp-auth-row{display:none;}
  .hp-auth-row.active{display:block;}
</style>

<div class="hp-auth-wrap">
  <div class="hp-auth-card">
    <div class="hp-auth-logo">
      <div class="hp-auth-logo-mark">H</div>
      <div class="hp-auth-brand">HostPilot</div>
    </div>

    <!-- Login / Register tabs -->
    <div class="hp-auth-tabs" id="hp-tabs">
      <button class="hp-auth-tab active" data-tab="login">Sign In</button>
      <button class="hp-auth-tab" data-tab="register">Create Account</button>
    </div>

    <!-- Message container -->
    <div class="hp-auth-msg" id="hp-msg"></div>

    <!-- LOGIN -->
    <div class="hp-auth-row active" id="hp-login">
      <h1 class="hp-auth-h1">Welcome back</h1>
      <p class="hp-auth-sub">Sign in to access your dashboard.</p>
      <form id="hp-login-form">
        <div class="hp-auth-field">
          <label class="hp-auth-label">Email</label>
          <input class="hp-auth-input" type="email" name="email" required autocomplete="email">
        </div>
        <div class="hp-auth-field">
          <label class="hp-auth-label">Password</label>
          <input class="hp-auth-input" type="password" name="password" required autocomplete="current-password">
        </div>
        <button class="hp-auth-btn" type="submit">Sign In</button>
        <a class="hp-auth-link" data-go="forgot">Forgot password?</a>
      </form>
    </div>

    <!-- REGISTER -->
    <div class="hp-auth-row" id="hp-register">
      <h1 class="hp-auth-h1">Create your account</h1>
      <p class="hp-auth-sub">We'll email you to confirm.</p>
      <form id="hp-register-form">
        <div class="hp-auth-field">
          <label class="hp-auth-label">First name</label>
          <input class="hp-auth-input" type="text" name="firstName" required>
        </div>
        <div class="hp-auth-field">
          <label class="hp-auth-label">Email</label>
          <input class="hp-auth-input" type="email" name="email" required autocomplete="email">
        </div>
        <div class="hp-auth-field">
          <label class="hp-auth-label">Password (min 8 characters)</label>
          <input class="hp-auth-input" type="password" name="password" required minlength="8" autocomplete="new-password">
        </div>
        <button class="hp-auth-btn" type="submit">Create Account</button>
      </form>
    </div>

    <!-- FORGOT -->
    <div class="hp-auth-row" id="hp-forgot">
      <h1 class="hp-auth-h1">Reset your password</h1>
      <p class="hp-auth-sub">We'll email you a reset link.</p>
      <form id="hp-forgot-form">
        <div class="hp-auth-field">
          <label class="hp-auth-label">Email</label>
          <input class="hp-auth-input" type="email" name="email" required>
        </div>
        <button class="hp-auth-btn" type="submit">Send Reset Link</button>
        <a class="hp-auth-link" data-go="login">← Back to sign in</a>
      </form>
    </div>
  </div>
</div>

<script>
(function(){
  // ─────────────────────────────────────────────────────────────
  // ⚠️ PALITAN MO ITO ng Render URL mo!
  const API_BASE = 'https://YOUR-APP.onrender.com';
  // For local: 'http://localhost:3000'
  // ─────────────────────────────────────────────────────────────

  // Where to redirect after login (your dashboard page on GHL)
  const DASHBOARD_URL = '/dashboard';

  const $  = s => document.querySelector(s);
  const $$ = s => document.querySelectorAll(s);

  function showMsg(text, type = 'error') {
    const el = $('#hp-msg');
    el.textContent = text;
    el.className = `hp-auth-msg ${type} show`;
    setTimeout(() => el.classList.remove('show'), 5000);
  }

  function showRow(id) {
    $$('.hp-auth-row').forEach(r => r.classList.remove('active'));
    $('#hp-' + id).classList.add('active');
  }

  // Tabs
  $$('.hp-auth-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      $$('.hp-auth-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      showRow(btn.dataset.tab);
    });
  });

  // Forgot/back links
  document.addEventListener('click', e => {
    const link = e.target.closest('[data-go]');
    if (link) { e.preventDefault(); showRow(link.dataset.go); }
  });

  // ── LOGIN ──
  $('#hp-login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Signing in...';

    try {
      const res = await fetch(`${API_BASE}/auth/login`, {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: fd.get('email'),
          password: fd.get('password'),
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Login failed');

      // Store access token + user
      sessionStorage.setItem('hp_access_token', data.accessToken);
      sessionStorage.setItem('hp_user', JSON.stringify(data.user));

      showMsg('Signed in! Redirecting...', 'success');
      setTimeout(() => { window.location.href = DASHBOARD_URL; }, 600);
    } catch (err) {
      showMsg(err.message);
      btn.disabled = false; btn.textContent = 'Sign In';
    }
  });

  // ── REGISTER ──
  $('#hp-register-form').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Creating account...';

    try {
      const res = await fetch(`${API_BASE}/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email:     fd.get('email'),
          password:  fd.get('password'),
          firstName: fd.get('firstName'),
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Registration failed');

      showMsg('Account created! Check your email to verify.', 'success');
      e.target.reset();
    } catch (err) {
      showMsg(err.message);
    } finally {
      btn.disabled = false; btn.textContent = 'Create Account';
    }
  });

  // ── FORGOT PASSWORD ──
  $('#hp-forgot-form').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Sending...';

    try {
      const res = await fetch(`${API_BASE}/auth/forgot-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: fd.get('email') }),
      });
      const data = await res.json();
      showMsg(data.message || 'Check your email', 'success');
    } catch (err) {
      showMsg('Something went wrong');
    } finally {
      btn.disabled = false; btn.textContent = 'Send Reset Link';
    }
  });

  // Auto-redirect kung naka-login na
  if (sessionStorage.getItem('hp_access_token')) {
    fetch(`${API_BASE}/auth/me`, {
      headers: { 'Authorization': 'Bearer ' + sessionStorage.getItem('hp_access_token') },
    }).then(r => {
      if (r.ok) window.location.href = DASHBOARD_URL;
    });
  }
})();
</script>
